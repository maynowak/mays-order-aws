version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-central-1"
    ALLOW_AWS_OPERATIONS: "true"
    DRY_RUN: "false"
  parameter-store:
    PROJECT_NAME: "/mays-installer/ci/project-name"
    ENVIRONMENT: "/mays-installer/ci/environment"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - pip install --quiet --upgrade pip
      - pip install --quiet boto3 pytest
      - echo "Installing Terraform..."
      - dnf install -y dnf-plugins-core
      - dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - dnf -y install terraform
      - terraform version

  pre_build:
    commands:
      - echo "Starting DEPLOY stage..."
      - echo "Loading deployment context and plan artifact..."
      - |
        if [ -n "${CODEBUILD_SRC_DIR_plan_output:-}" ] && [ -f "${CODEBUILD_SRC_DIR_plan_output}/deployment_context.json" ]; then
          cp "${CODEBUILD_SRC_DIR_plan_output}/deployment_context.json" .
          cp "${CODEBUILD_SRC_DIR_plan_output}/plan_artifact.json" .
          if [ -d "${CODEBUILD_SRC_DIR_plan_output}/.mays-installer" ]; then
            cp -r "${CODEBUILD_SRC_DIR_plan_output}/.mays-installer" .
            echo "Copied .mays-installer from plan_output"
          fi
          echo "Copied deployment_context.json and plan_artifact.json from plan_output"
        elif [ -f "/codebuild/input/plan_output/deployment_context.json" ]; then
          cp /codebuild/input/plan_output/deployment_context.json .
          cp /codebuild/input/plan_output/plan_artifact.json .
          if [ -d "/codebuild/input/plan_output/.mays-installer" ]; then
            cp -r "/codebuild/input/plan_output/.mays-installer" .
            echo "Copied .mays-installer from /codebuild/input/plan_output"
          fi
          echo "Copied deployment_context.json and plan_artifact.json from /codebuild/input/plan_output"
        else
          echo "ERROR: deployment_context.json or plan_artifact.json not found!"
          ls -la "${CODEBUILD_SRC_DIR_plan_output:-/codebuild/input/plan_output}" 2>/dev/null || true
          exit 1
        fi
      - cat deployment_context.json
      - cat plan_artifact.json
      - echo "Initializing Terraform for provider plugins..."
      - if [ -d "terraform" ]; then terraform -chdir=terraform init -input=false; else terraform init -input=false; fi

  build:
    commands:
      - echo "Running installer deploy with exact saved plan..."
      - |
        cat > deploy.py << 'EOF'
        import json
        import subprocess
        import sys
        import os
        from pathlib import Path
        
        # Load context and plan artifact
        with open("deployment_context.json") as f:
            ctx = json.load(f)
        
        with open("plan_artifact.json") as f:
            plan_info = json.load(f)
        
        plan_path = plan_info["plan_path"]
        plan_meta = plan_info["plan_metadata"]
        
        print(f"Deploying plan: {plan_path}")
        print(f"Plan metadata: {json.dumps(plan_meta, indent=2)}")
        
        # Verify plan identity matches deployment context
        expected_id = f"{ctx['account_id']}:{ctx['project_name']}:{ctx['environment'].lower()}"
        dep_id_obj = plan_meta.get("deployment_id")
        if isinstance(dep_id_obj, dict):
            plan_id = f"{dep_id_obj['account_id']}:{dep_id_obj['project']}:{str(dep_id_obj['environment']).lower()}"
        else:
            plan_id = dep_id_obj
        if plan_id != expected_id:
            print(f"ERROR: Plan deployment ID mismatch!")
            print(f"  Expected: {expected_id}")
            print(f"  Plan:     {plan_id}")
            sys.exit(1)
        
        if plan_meta.get("operation") != "deploy":
            print(f"ERROR: Plan operation mismatch! Expected deploy, got {plan_meta.get('operation')}")
            sys.exit(1)
        
        # Run deploy
        cmd = [
            "python3", "-m", "installer.cli.main",
            "--deployment-version", ctx["deployment_version"],
            "--development-phase", ctx["development_phase"],
            "--development-step", str(ctx["development_step"]),
            "--development-status", ctx["development_status"],
            "deploy",
            "--plan", plan_path,
            "--yes"
        ]
        
        env = os.environ.copy()
        env["ALLOW_AWS_OPERATIONS"] = "true"
        env["DRY_RUN"] = "false"
        env["AWS_REGION"] = ctx["aws_region"]
        # Only set AWS_PROFILE if present (local dev); omit for CI/CD IAM role
        if ctx.get("aws_profile"):
            env["AWS_PROFILE"] = ctx["aws_profile"]
        
        result = subprocess.run(cmd, env=env, capture_output=True, text=True)
        print(result.stdout)
        if result.stderr:
            print(result.stderr, file=sys.stderr)
        
        if result.returncode != 0:
            sys.exit(result.returncode)
        
        EOF
      - python3 deploy.py

  post_build:
    commands:
      - echo "Deploy stage completed successfully"
      - echo "Generating deployment report..."
      - |
        cat > generate_report.py << 'EOF'
        import json
        from datetime import datetime
        
        with open("deployment_context.json") as f:
            ctx = json.load(f)
        
        with open("plan_artifact.json") as f:
            plan_info = json.load(f)
        
        report = {
            "stage": "DEPLOY",
            "timestamp": datetime.utcnow().isoformat() + "Z",
            "deployment_id": f"{ctx['account_id']}:{ctx['project_name']}:{ctx['environment'].lower()}",
            "version": ctx["deployment_version"],
            "development_phase": ctx["development_phase"],
            "development_step": ctx["development_step"],
            "status": "SUCCESS",
            "plan_sequence": plan_info.get("plan_metadata", {}).get("sequence_number")
        }
        
        with open("deploy_report.json", "w") as f:
            json.dump(report, f, indent=2)
        
        print(json.dumps(report, indent=2))
        EOF
      - python3 generate_report.py

artifacts:
  files:
    - deployment_context.json
    - plan_artifact.json
    - deploy_report.json
  discard-paths: no
  base-directory: '.'