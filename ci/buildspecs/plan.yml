version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-central-1"
    DEPLOYMENT_VERSION: "0.1.0"
    DEVELOPMENT_PHASE: "H2"
    DEVELOPMENT_STEP: "0"
    DEVELOPMENT_STATUS: "development"
  parameter-store:
    PROJECT_NAME: "/mays-installer/ci/project-name"
    ENVIRONMENT: "/mays-installer/ci/environment"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - pip install --quiet --upgrade pip
      - pip install --quiet boto3 pytest
      - echo "Installing Terraform..."
      - |
        export release=AmazonLinux
        dnf install -y dnf-plugins-core
        dnf config-manager --add-repo https://rpm.releases.hashicorp.com/$release/hashicorp.repo
        dnf install -y terraform

  pre_build:
    commands:
      - echo "Starting PLAN stage..."
      - echo "Loading deployment context from validation stage..."
      - |
        # Prefer the validation output artifact from the Validate stage.
        if [ -n "${CODEBUILD_SRC_DIR_validate_output:-}" ] && [ -f "${CODEBUILD_SRC_DIR_validate_output}/deployment_context.json" ]; then
          cp "${CODEBUILD_SRC_DIR_validate_output}/deployment_context.json" .
          echo "Copied deployment_context.json from validate_output"
        elif [ -f "/codebuild/input/validate_output/deployment_context.json" ]; then
          cp /codebuild/input/validate_output/deployment_context.json .
          echo "Copied deployment_context.json from /codebuild/input/validate_output"
        elif [ -f "deployment_context.json" ]; then
          echo "Found deployment_context.json in working directory"
        elif [ -f "/codebuild/input/validation_output/deployment_context.json" ]; then
          cp /codebuild/input/validation_output/deployment_context.json .
          echo "Copied deployment_context.json from legacy validation_output path"
        else
          echo "ERROR: deployment_context.json not found!"
          echo "Listing current directory:"
          ls -la .
          echo "Checking validate output paths:"
          ls -la "${CODEBUILD_SRC_DIR_validate_output:-/codebuild/input/validate_output}" 2>/dev/null || true
          exit 1
        fi
      - cat deployment_context.json

  build:
    commands:
      - echo "Running installer plan generation..."
      - |
        python3 -m installer.cli.main \
          --deployment-version ${DEPLOYMENT_VERSION} \
          --development-phase ${DEVELOPMENT_PHASE} \
          --development-step ${DEVELOPMENT_STEP} \
          --development-status ${DEVELOPMENT_STATUS} \
          plan
      - echo "Plan generation completed"

  post_build:
    commands:
      - echo "Locating generated plan artifacts..."
      - |
        cat > find_plan.py << 'EOF'
        import json
        import sys
        import os
        from pathlib import Path
        
        # Find deployment_context.json copied into the primary source directory,
        # then fall back to the validate_output artifact paths for compatibility.
        ctx_file = Path("deployment_context.json")
        if not ctx_file.exists():
            alt_paths = [
                Path(os.environ.get("CODEBUILD_SRC_DIR_validate_output", "/codebuild/input/validate_output")) / "deployment_context.json",
                Path("/codebuild/input/validate_output/deployment_context.json"),
                Path("/codebuild/input/validation_output/deployment_context.json"),
                Path("/codebuild/output/src/deployment_context.json"),
            ]
            for alt_path in alt_paths:
                if alt_path.exists():
                    ctx_file = alt_path
                    break
        
        # Load context for identity verification
        if not ctx_file.exists():
            print("ERROR: deployment_context.json not found")
            sys.exit(1)
        
        with open(ctx_file) as f:
            ctx = json.load(f)
        
        # Find the latest plan with H2 identity
        runs_dir = Path(".mays-installer/runs")
        latest_plan = None
        latest_meta = None
        
        if runs_dir.exists():
            for run_dir in sorted(runs_dir.iterdir(), key=lambda p: p.stat().st_mtime, reverse=True):
                plans_dir = run_dir / "plans"
                if not plans_dir.exists():
                    continue
                
                for meta_file in plans_dir.glob("*.meta.json"):
                    with open(meta_file) as f:
                        meta = json.load(f)
                    
                    # Verify deployment identity matches
                    with open("deployment_context.json") as f:
                        ctx = json.load(f)
                    
                    deployment_id_obj = meta.get("deployment_id")
                    if isinstance(deployment_id_obj, dict):
                        dep_id_str = f"{deployment_id_obj['account_id']}:{deployment_id_obj['project']}:{deployment_id_obj['environment']}"
                    else:
                        dep_id_str = deployment_id_obj
                    expected_id = f"{ctx['account_id']}:{ctx['project_name']}:{ctx['environment']}"
                    if dep_id_str == expected_id:
                        # Plan file is saved as <operation>.tfplan by RunDirectoryManager.save_plan_file
                        operation = meta.get("operation", "deploy")
                        plan_path = plans_dir / f"{operation}.tfplan"
                        if plan_path.exists():
                            latest_plan = str(plan_path)
                            latest_meta = meta
                            break
                
                if latest_plan:
                    break
        
        if not latest_plan:
            print("ERROR: No matching plan found")
            sys.exit(1)
        
        # Save plan location for deploy stage
        plan_info = {
            "plan_path": latest_plan,
            "plan_metadata": latest_meta
        }
        
        with open("plan_artifact.json", "w") as f:
            json.dump(plan_info, f, indent=2)
        
        print(f"Found plan: {latest_plan}")
        print(f"Plan metadata: {json.dumps(latest_meta, indent=2)}")
        EOF
      - python3 find_plan.py
      - echo "Plan stage completed successfully"

artifacts:
  files:
    - deployment_context.json
    - plan_artifact.json
    - .mays-installer/runs/**/*
  discard-paths: no
  base-directory: '.'