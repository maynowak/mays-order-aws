name: "Dependency Change Detection"

# Reusable only: security.yml is the single trigger surface.  Adding direct
# triggers here would duplicate dependency scans for the same event.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency detector
        id: detector
        run: |
          set +e
          python3 security/dependency_detector.py > dependency_result.json
          DETECTOR_EXIT=$?
          set -e
          cat dependency_result.json
          echo "detector_exit=$DETECTOR_EXIT" >> $GITHUB_OUTPUT
          echo "result=$(cat dependency_result.json | jq -r .status)" >> $GITHUB_OUTPUT

          if [ "$DETECTOR_EXIT" -eq 2 ]; then
            echo "::error::Dependency detector failed"
            exit 2
          fi

      - name: Convert to SARIF
        run: |
          python3 -m security.sarif_adapter dependency_result.json dependency_result.sarif
          cat dependency_result.sarif

      - name: Validate SARIF
        run: |
          # Basic SARIF validation
          python3 -c "
          import json
          with open('dependency_result.sarif') as f:
              sarif = json.load(f)
          assert sarif.get('version') == '2.1.0', 'SARIF version must be 2.1.0'
          assert 'runs' in sarif, 'SARIF must have runs'
          for run in sarif['runs']:
              assert 'tool' in run, 'Run must have tool'
              assert 'driver' in run['tool'], 'Tool must have driver'
              assert 'results' in run, 'Run must have results'
          print('SARIF validation passed')
          "

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency_result.json
          retention-days: 30

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency_result.sarif
          # Stable dependency category.  Do not change without a documented
          # alert/category migration plan.
          category: dependency-check

      - name: Upload Dependency SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sarif
          path: dependency_result.sarif
          retention-days: 30

      - name: Report result
        run: |
          STATUS=$(jq -r .status dependency_result.json)
          SUMMARY=$(jq -r .summary dependency_result.json)
          echo "Dependency Status: $STATUS"
          echo "Summary: $SUMMARY"
          if [ "$STATUS" = "DEPENDENCY_CHANGE_DETECTED" ]; then
            echo "::warning::Dependency changes detected - review required"
            jq -r '.dependencies[] | select(.status=="CONSTRAINT_UNSATISFIED" or .status=="UPDATE_AVAILABLE" or .status=="CHANGED" or .status=="LOCK_CONSTRAINT_DRIFT" or .status=="LOCK_MISSING" or .status=="REGISTRY_INCOMPLETE") | "\(.name) (\(.type)): \(.status) declared=\(.current_version) locked=\(.locked_version // "missing") latest=\(.latest_compatible // "none")"' dependency_result.json
          elif [ "$STATUS" = "DEPENDENCY_CHECK_ERROR" ]; then
            echo "::error::Dependency check failed"
            exit 1
          else
            echo "::notice::All dependencies are current"
          fi
