name: "CodeQL Analysis"

# Reusable only: security.yml is the single trigger surface.  Adding direct
# triggers here would duplicate analyses for the same commit/ref/language.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Locate CodeQL SARIF file
        run: |
          # CodeQL writes SARIF to results/*.sarif outside the workspace.
          # Copy it to a known in-workspace location for artifact upload.
          if [ -d "../results" ]; then
            cp ../results/*.sarif ./codeql-results.sarif 2>/dev/null || true
          fi
          if [ -d "results" ]; then
            cp results/*.sarif ./codeql-results.sarif 2>/dev/null || true
          fi
          ls -la codeql-results.sarif 2>/dev/null || echo "No SARIF file found"

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results.sarif
          retention-days: 30
          if-no-files-found: warn
