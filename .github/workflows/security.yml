name: "Security & Dependency Analysis"

# Single trigger surface for all security scans.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_codeql:
        description: "Run CodeQL analysis"
        type: boolean
        default: true
      run_dependency:
        description: "Run dependency change detection"
        type: boolean
        default: true

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 3 * * 1') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_codeql)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
        include:
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: results/*.sarif
          retention-days: 30

  dependency-check:
    name: Dependency Change Detection
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 6 * * *') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_dependency)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency detector
        id: detector
        run: |
          set +e
          python3 security/dependency_detector.py > dependency_result.json
          DETECTOR_EXIT=$?
          set -e
          cat dependency_result.json
          echo "detector_exit=$DETECTOR_EXIT" >> $GITHUB_OUTPUT
          echo "result=$(cat dependency_result.json | jq -r .status)" >> $GITHUB_OUTPUT

          if [ "$DETECTOR_EXIT" -eq 2 ]; then
            echo "::error::Dependency detector failed"
            exit 2
          fi

      - name: Convert to SARIF
        run: |
          python3 -m security.sarif_adapter dependency_result.json dependency_result.sarif

      - name: Validate SARIF
        run: |
          python3 -c "
          import json
          with open('dependency_result.sarif') as f:
              sarif = json.load(f)
          assert sarif.get('version') == '2.1.0', 'SARIF version must be 2.1.0'
          assert 'runs' in sarif, 'SARIF must have runs'
          for run in sarif['runs']:
              assert 'tool' in run, 'Run must have tool'
              assert 'driver' in run['tool'], 'Tool must have driver'
              assert 'results' in run, 'Run must have results'
          print('SARIF validation passed')
          "

      - name: Upload Dependency SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sarif
          path: dependency_result.sarif
          retention-days: 30

  security-gate:
    name: Security Gate (findings evaluation)
    needs: [codeql, dependency-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (none needed – pure Python)
        run: |

      # ---- Determine which scanners were selected for this run -----------
      - name: Set scan selection variables
        run: |
          echo "CodeQL result: ${{ needs.codeql.result }}"
          echo "Dependency result: ${{ needs.dependency-check.result }}"

      # ---- Download CodeQL SARIF artifact --------------------------------
      - name: Download CodeQL SARIF artifact
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        uses: actions/download-artifact@v3
        with:
          name: codeql-sarif
          path: .github/workflow-sarif

      - name: Normalize CodeQL SARIF filename
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        run: |
          ls -la .github/workflow-sarif/ || true
          find .github/workflow-sarif -name "*.sarif" -exec mv {} .github/workflow-sarif/codeql-results.sarif \;

      # ---- Download Dependency SARIF artifact ----------------------------
      - name: Download Dependency SARIF artifact
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        uses: actions/download-artifact@v3
        with:
          name: dependency-sarif
          path: .github/workflow-sarif

      - name: Normalize Dependency SARIF filename
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        run: |
          find .github/workflow-sarif -name "dependency_result.sarif" -exec mv {} .github/workflow-sarif/dependency-results.sarif \;

      # ---- Run Findings Gate (CodeQL) ------------------------------------
      - name: Run Findings Gate (CodeQL)
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        run: |
          bash security/run_findings_gate.sh ".github/workflow-sarif/codeql-results.sarif" "true"

      # ---- Run Findings Gate (Dependency) --------------------------------
      - name: Run Findings Gate (Dependency)
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        run: |
          bash security/run_findings_gate.sh ".github/workflow-sarif/dependency-results.sarif" "true"

      # ---- Handle unselected scanners ------------------------------------
      - name: Report unselected scanners
        if: always()
        run: |
          if [ "${{ needs.codeql.result }}" = "skipped" ] || [ "${{ needs.codeql.result }}" = "" ]; then
            echo "::notice::CodeQL not selected for this run – NOT EVALUATED (MO-GH-SEC-03)"
          fi
          if [ "${{ needs.dependency-check.result }}" = "skipped" ] || [ "${{ needs.dependency-check.result }}" = "" ]; then
            echo "::notice::Dependency check not selected for this run – NOT EVALUATED (MO-GH-SEC-03)"
          fi

      # ---- Security Gate Summary -----------------------------------------
      - name: Security Gate Summary
        if: always()
        run: |
          echo "Security Gate (MO-GH-SEC-03) completed"
          echo "CodeQL result: ${{ needs.codeql.result }}"
          echo "Dependency result: ${{ needs.dependency-check.result }}"
          {
            echo "### Security Gate (MO-GH-SEC-03) Summary"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| CodeQL | \`${{ needs.codeql.result }}\` |"
            echo "| Dependency | \`${{ needs.dependency-check.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"