name: "Security & Dependency Analysis"

# Single trigger surface for all security scans.  codeql.yml and
# dependency-check.yml are workflow_call-only reusable workflows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_codeql:
        description: "Run CodeQL analysis"
        type: boolean
        default: true
      run_dependency:
        description: "Run dependency change detection"
        type: boolean
        default: true

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 3 * * 1') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_codeql)
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  dependency-check:
    name: Dependency Change Detection
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 6 * * *') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_dependency)
    uses: ./.github/workflows/dependency-check.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  security-gate:
    name: Security Gate (findings evaluation)
    needs: [codeql, dependency-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (none needed – pure Python)
        run: |

      # ---- Determine which scanners were selected ------------------------
      - name: Set scan selection variables
        run: |
          echo "CodeQL result: ${{ needs.codeql.result }}"
          echo "Dependency result: ${{ needs.dependency-check.result }}"

      # ---- Handle scanner failures ---------------------------------------
      # FAIL: Scanner ran but found critical/high findings
      # FAILED: Scanner itself failed (infrastructure/tooling error)
      # CANCELLED: Scanner was cancelled (timeout, concurrency, etc.)
      - name: Check for scanner failures
        if: always()
        id: scanner-failures
        run: |
          # Check if any selected scanner failed
          CODEQL_SELECTED=${{ needs.codeql.result != 'skipped' && needs.codeql.result != '' }}
          DEP_SELECTED=${{ needs.dependency-check.result != 'skipped' && needs.dependency-check.result != '' }}

          echo "codeql_selected=$CODEQL_SELECTED" >> $GITHUB_OUTPUT
          echo "dependency_selected=$DEP_SELECTED" >> $GITHUB_OUTPUT

          if [ "$CODEQL_SELECTED" = "true" ] && [ "${{ needs.codeql.result }}" = "failure" ]; then
            echo "codeql_failed=true" >> $GITHUB_OUTPUT
          else
            echo "codeql_failed=false" >> $GITHUB_OUTPUT
          fi

          if [ "$DEP_SELECTED" = "true" ] && [ "${{ needs.dependency-check.result }}" = "failure" ]; then
            echo "dependency_failed=true" >> $GITHUB_OUTPUT
          else
            echo "dependency_failed=false" >> $GITHUB_OUTPUT
          fi

      # ---- Download CodeQL SARIF artifact --------------------------------
      - name: Download CodeQL SARIF artifact
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        uses: actions/download-artifact@v4
        with:
          name: codeql-sarif
          path: .github/workflow-sarif

      - name: Normalize CodeQL SARIF filename
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        run: |
          ls -la .github/workflow-sarif/ || true
          find .github/workflow-sarif -name "*.sarif" -exec mv {} .github/workflow-sarif/codeql-results.sarif \;

      # ---- Download Dependency SARIF artifact ----------------------------
      - name: Download Dependency SARIF artifact
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        uses: actions/download-artifact@v4
        with:
          name: dependency-sarif
          path: .github/workflow-sarif

      - name: Normalize Dependency SARIF filename
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        run: |
          find .github/workflow-sarif -name "dependency_result.sarif" -exec mv {} .github/workflow-sarif/dependency-results.sarif \;

      # ---- Run Findings Gate (CodeQL) ------------------------------------
      - name: Run Findings Gate (CodeQL)
        if: ${{ needs.codeql.result == 'success' || needs.codeql.result == 'neutral' }}
        run: |
          # Determine if CodeQL is selected (not skipped, not empty)
          CODEQL_SELECTED="${{ needs.codeql.result != 'skipped' && needs.codeql.result != '' }}"

          # Run the findings gate with scanner metadata
          bash security/run_findings_gate.sh \
            ".github/workflow-sarif/codeql-results.sarif" \
            "$CODEQL_SELECTED" \
            "codeql" \
            "${{ github.sha }}" \
            "${{ github.ref }}" \
            "${{ github.run_attempt }}" || {
            echo "::error::CodeQL findings gate FAILED – blocking security gate"
            exit 1
          }

      # ---- Run Findings Gate (Dependency) --------------------------------
      - name: Run Findings Gate (Dependency)
        if: ${{ needs.dependency-check.result == 'success' || needs.dependency-check.result == 'neutral' }}
        run: |
          # Determine if Dependency check is selected
          DEP_SELECTED="${{ needs.dependency-check.result != 'skipped' && needs.dependency-check.result != '' }}"

          # Run the findings gate with scanner metadata
          bash security/run_findings_gate.sh \
            ".github/workflow-sarif/dependency-results.sarif" \
            "$DEP_SELECTED" \
            "dependency" \
            "${{ github.sha }}" \
            "${{ github.ref }}" \
            "${{ github.run_attempt }}" || {
            echo "::error::Dependency findings gate FAILED – blocking security gate"
            exit 1
          }

      # ---- Handle scanner failures ---------------------------------------
      - name: Fail gate on scanner failure
        if: steps.scanner-failouts.outputs.codeql_failed == 'true' || steps.scanner-failouts.outputs.dependency_failed == 'true'
        run: |
          echo "::error::One or more scanners failed – gate BLOCKED (MO-GH-SEC-03)"
          exit 1

      # ---- Handle unselected / failed scanners ---------------------------
      - name: Report scanner status
        if: always()
        run: |
          CODEQL_STATUS="${{ needs.codeql.result }}"
          DEP_STATUS="${{ needs.dependency-check.result }}"

          if [ "$CODEQL_STATUS" = "skipped" ] || [ "$CODEQL_STATUS" = "" ]; then
            echo "::notice::CodeQL not selected for this run – NOT EVALUATED (MO-GH-SEC-03)"
          fi

          if [ "$DEP_STATUS" = "skipped" ] || [ "$DEP_STATUS" = "" ]; then
            echo "::notice::Dependency check not selected for this run – NOT EVALUATED (MO-GH-SEC-03)"
          fi

          if [ "$CODEQL_STATUS" = "failure" ]; then
            echo "::error::CodeQL scanner failed – gate BLOCKED (MO-GH-SEC-03)"
          fi

          if [ "$DEP_STATUS" = "failure" ]; then
            echo "::error::Dependency scanner failed – gate BLOCKED (MO-GH-SEC-03)"
          fi

      # ---- Upload combined Findings Report -------------------------------
      - name: Upload Findings Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-report
          path: ".github/workflow-sarif/*.gate-report.json"
          retention-days: 30
          if-no-files-found: error

      # ---- Security Gate Summary -----------------------------------------
      - name: Security Gate Summary
        if: always()
        run: |
          echo "Security Gate (MO-GH-SEC-03) completed"
          echo "CodeQL result: ${{ needs.codeql.result }}"
          echo "Dependency result: ${{ needs.dependency-check.result }}"
          {
            echo "### Security Gate (MO-GH-SEC-03) Summary"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| CodeQL | \`${{ needs.codeql.result }}\` |"
            echo "| Dependency | \`${{ needs.dependency-check.result }}\` |"
            echo ""
            echo "Findings Gate evaluation executed against downloaded SARIF artifacts."
            echo "Machine-readable report uploaded as 'findings-report' artifact."
            echo ""
            echo "**Metadata:**"
            echo "- SHA: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo "- Attempt: ${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"