name: "Security & Dependency Analysis"

# Single trigger surface for all security scans.  codeql.yml and
# dependency-check.yml are workflow_call-only reusable workflows; do not add
# push/pull_request/schedule/dispatch triggers to them again.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly CodeQL, preserving the previous Monday 03:00 UTC cadence.
    - cron: '0 3 * * 1'
    # Daily dependency check, preserving the previous 06:00 UTC cadence.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_codeql:
        description: "Run CodeQL analysis"
        type: boolean
        default: true
      run_dependency:
        description: "Run dependency change detection"
        type: boolean
        default: true

concurrency:
  # One security run per ref.  Pull-request updates cancel older runs; push
  # and scheduled runs are serialized instead of running in parallel.
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 3 * * 1') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_codeql)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  dependency-check:
    name: Dependency Change Detection
    if: >
      (github.event_name != 'schedule' || github.event.schedule == '0 6 * * *') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_dependency)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/dependency-check.yml

  security-gate:
    name: Security Gate (findings evaluation)
    needs: [codeql, dependency-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (none needed – pure Python)
        run: |

      - name: Run Findings Gate (CodeQL)
        if: always() && github.event_name != 'schedule'
        run: |
          bash security/run_findings_gate.sh ".github/workflow-sarif/codeql-results.sarif" "$RUN_CODEQL"

      - name: Run Findings Gate (Dependency)
        if: always() && github.event_name != 'schedule'
        run: |
          bash security/run_findings_gate.sh ".github/workflow-sarif/dependency-results.sarif" "$RUN_DEPENDENCY"

      - name: Security Gate Summary
        if: always()
        run: |
          echo "Security Gate (MO-GH-SEC-03) completed"